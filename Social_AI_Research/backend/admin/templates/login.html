<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAIR Admin — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { rutgers: { DEFAULT: '#cc0033', dark: '#a30029', light: '#e6204c' } },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        },
      },
    };
  </script>
  <style>
    body { -webkit-font-smoothing: antialiased; letter-spacing: -0.01em; }
  </style>
</head>
<body class="h-full bg-zinc-950 text-zinc-100 font-sans antialiased">
  <div class="relative h-full grid place-items-center px-4 py-12 overflow-hidden">

    {# Subtle background gradients #}
    <div class="absolute inset-0 -z-10 pointer-events-none" aria-hidden="true">
      <div class="absolute top-0 left-1/4 w-[600px] h-[600px] rounded-full blur-3xl"
           style="background: radial-gradient(circle, rgba(204,0,51,0.12) 0%, transparent 60%);"></div>
      <div class="absolute bottom-0 right-1/4 w-[500px] h-[500px] rounded-full blur-3xl"
           style="background: radial-gradient(circle, rgba(204,0,51,0.07) 0%, transparent 60%);"></div>
    </div>

    <div class="w-full max-w-sm">

      <div class="rounded-2xl border border-zinc-800/80 bg-zinc-900/60 backdrop-blur p-8 shadow-2xl shadow-black/40">

        <div class="flex flex-col items-center mb-8">
          <div class="w-14 h-14 rounded-xl flex items-center justify-center text-white font-bold text-2xl shadow-lg shadow-rutgers/40 mb-4"
               style="background: linear-gradient(135deg, #cc0033 0%, #8a0023 100%);">S</div>
          <h1 class="text-xl font-bold tracking-tight">SAIR Admin</h1>
          <p class="text-[11px] uppercase tracking-[0.12em] text-zinc-500 mt-2">Social AI Feed Detector · Rutgers Research</p>
        </div>

        {% if error %}
          <div class="mb-5 px-3 py-2.5 rounded-lg bg-red-500/10 border border-red-500/30 text-red-300 text-sm">
            {{ error }}
          </div>
        {% endif %}

        <form action="/admin/login" method="post" class="space-y-4">
          <div>
            <label for="password" class="block text-[11px] uppercase tracking-[0.08em] text-zinc-500 font-semibold mb-2">
              Admin password
            </label>
            <input
              type="password"
              name="password"
              id="password"
              required
              autofocus
              autocomplete="current-password"
              class="w-full px-3.5 py-2.5 rounded-lg bg-zinc-950/80 border border-zinc-800 text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-rutgers focus:ring-2 focus:ring-rutgers/30 transition-all"
            />
          </div>

          <button
            type="submit"
            class="w-full px-3.5 py-2.5 rounded-lg bg-rutgers hover:bg-rutgers-light text-white font-semibold text-sm transition-colors shadow-lg shadow-rutgers/30"
          >
            Continue
          </button>
        </form>

        <p class="text-center text-[10px] uppercase tracking-[0.12em] text-zinc-600 mt-7">
          Session expires after 8 hours
        </p>
      </div>

    </div>
  </div>
</body>
</html>
